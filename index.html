<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: black;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Times New Roman', Times, serif;
            padding-top:30px;

        }
        .header-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 12px;
        }

        #status-bar{
            margin-bottom: 12px;
            font-size: 1.25rem;
            font-weight: bold;
            color: rgba(0, 166, 255, 0.551);  
        }
        #timer{
            font-size: 1.25rem;
            font-weight: bold;
            color: gold;
        }

        .game-container{
            display: flex;
            gap: 20px;
        }
        
        canvas {
            border: 3px solid black;
            width: 512px;
            height: 512px;
            image-rendering: pixelated;
            cursor: crosshair;
        }
        .palette{
            margin-top : 15px;
            display: flex;
            gap: 10px;
        }
        .chat-panel{
            width: 280px;
            height: 512px;
            display: flex;
            flex-direction: column;
            background: grey;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
        }
        .msg-wrong {
        color: red;
        font-weight: bold;
    }
        #messages{
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            margin: 0 0 10px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.9rem;
        }
        .msg-system{color: rgb(221, 221, 24); font-style: italic;}
        .msg-chat{color: aliceblue;}
        .chat-input-row{
            display: flex;
            gap: 6px;
        }
        input[type="text"]{
            flex: 1;
            padding: 8px;
            border-radius:4px;
            border: 1px solid rgb(134, 126, 126);
            background: black;
            color: white;
        }
        button{
            padding: 8px 12px;
            background: blue;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
    
</head>
<body>
    <h2>PixelCanvas Multi (64x64)</h2>
    <div class="header-row">
    <div id="status-bar">Connecting to server</div>
    <div id="timer"></div>
    
    </div>
    

    <div class="game-container">
        <div>
            <canvas id="board" width="64" height="64"></canvas>
            <div class="palette" id="toolbar" style="display: none;">
                <label>Pick color:</label>
                <input type="color" id="colorPicker" value="#000000">
            </div>
        </div>
        <div class="chat-panel">
            <ul id="messages"></ul>
            <div class="chat-input-row">
                <input type="text" id="guessInput" placeholder="Type your guess" disabled>
                <button id="sendBtn" disabled>Send</button>
            </div>
        </div>
    </div>

    <script src="client.js" defer></script>

</body>
</html>
